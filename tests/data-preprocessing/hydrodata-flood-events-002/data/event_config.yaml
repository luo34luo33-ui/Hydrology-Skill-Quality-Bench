schema_version: '1.2'
peak_detection:
  peak_quantile: 0.5
  prominence_factor: 0.1
  min_peak_distance_hours: 4.0
boundaries:
  boundary_fraction: 0.05
  boundary_persistence_steps: 2
  max_search_days: 2.0
merging:
  merge_gap_hours: 8.0
  valley_ratio_threshold: 0.6
filters:
  min_event_duration_hours: 1.0
  min_peak_flow_m3_s: null
  min_event_volume_m3: null
warmup:
  steps: 3
rainfall_support:
  lookback_hours: 6.0
  min_observed_rainfall_mm: 1.0
  no_rainfall_policy: keep
  missing_rainfall_policy: keep
shape_filter:
  min_plateau_duration_hours: 24.0
  min_plateau_fraction: 0.5
  plateau_range_fraction: 0.005
  min_jump_fraction: 0.1
  jump_window_steps: 2
