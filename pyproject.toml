[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrology-skill-quality-benchmark"
version = "0.1.0"
description = "A lightweight deterministic benchmark for hydrology agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "jsonschema>=4.21",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "xlsxwriter>=3.2",
  "geopandas>=0.14,<2",
  "matplotlib>=3.7,<4",
  "Pillow>=10,<13",
  "pyproj>=3.6,<4",
  "rasterio>=1.3,<2",
  "scikit-learn>=1.4",
  "shapely>=2,<3",
  "whitebox>=2.3,<3",
  "joblib>=1.3",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hydroSkillBench = "harness.cli:main"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests_harness"]
